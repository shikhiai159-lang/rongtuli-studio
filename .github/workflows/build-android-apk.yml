name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Verify canonical microphone source
        run: |
          test -s www/index.html
          grep -q '1.0.5-mic-diagnostic' www/index.html
          ! grep -q 'মাইক্রোফোন চালু হয়নি—ব্রাউজারের অনুমতি দিন।' www/index.html
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app into Android project
        run: npx cap sync android
      - name: Add Android microphone permission
        run: python3 scripts/patch-android-mic-permission.py
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rongtuli-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
