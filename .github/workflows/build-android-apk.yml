name: Build Rongtuli Studio APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Package, Config & Permissions
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true

          # Inject Audio Permissions into AndroidManifest.xml safely
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "RECORD_AUDIO" "$MANIFEST_PATH"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>' "$MANIFEST_PATH"
            fi
          fi

          # Ensure MainActivity handles web permissions for microphone
          MAIN_ACTIVITY="android/app/src/main/java/com/shikhiai/rongtulistudio/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            # Check and add WebChromeClient permission request handler if not present
            if ! grep -q "onPermissionRequest" "$MAIN_ACTIVITY"; then
              sed -i '/public class MainActivity extends BridgeActivity {/a \    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        this.bridge.getWebView().setWebChromeClient(new android.webkit.WebChromeClient() {\n            @Override\n            public void onPermissionRequest(final android.webkit.PermissionRequest request) {\n                request.grant(request.getResources());\n            }\n        });\n    }' "$MAIN_ACTIVITY"
            fi
          fi

          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rongtuli-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
