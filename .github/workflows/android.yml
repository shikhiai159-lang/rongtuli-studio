name: Build Rongtuli Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate project files and JavaScript
        run: npm run check

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Patch Android project (Kotlin duplicate-class fix, microphone permission)
        run: python3 scripts/patch-android.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rongtuli-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
